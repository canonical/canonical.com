name: Links on canonical.com live

on:
  schedule:
    - cron: "20 7 * * 1-5"

jobs:
  check-links:
    if: github.repository == 'canonical/canonical.com'
    runs-on: ubuntu-latest

    steps:
      - name: Install linkchecker
        run: sudo pip install LinkChecker

      - name: Write linkchecker config file
        run: |
          mkdir -p ~/.linkchecker
          cat > ~/.linkchecker/linkcheckerrc <<EOF
          [checking]
          maxrequestspersecond=5
          recursionlevel=2
          timeout=1000
          sslverify=0

          [filtering]
          checkextern=1
          ignore=
            https://res.cloudinary.com
            q_auto
            fl_sanitize
            c_fill
            e_sharpen
            w_[0-9]*
            h_[0-9]*
            https://canonical.com/blog
            https://ubuntu.com/blog
            https://canonical.com/static/css/*
            https://www.xilinx.com/*
            https://player.vimeo.com/video/*
            http://atea.com
            https://linuxpolska.com/*
            https://www.packet.net
            https://www.amd.com/
            https://start.microsemi.com
            http://www.omnicore-it.com/
            http://www.pgp.com/
            https://www.hcl.com/
            http://www.randrinc.com/
            https://www.storagemadeeasy.com/

          [output]
          status=0
          warnings=0
          ignoreerrors=
            ^http?s://.* ^.*(471|500|503|504|400|403|401)
            ^http?s://.* Connection aborted
            ^http?s://.* Connection reset by peer
            ^http?s://.* RemoteDisconnected
            ^http?s://.* Read timed out
          EOF

      - name: Run linkchecker for 404 errors only
        run: |
          set -u

          # First pass: full crawl. Capture any failed links to a CSV file.
          if linkchecker --no-warning -F csv/failed-links.csv https://canonical.com; then
            echo "No broken links found."
            exit 0
          fi

          # Extract the failed URLs (valid=False) from the CSV output.
          python3 - <<'PY' > failed-urls.txt
          import csv

          seen = set()
          with open("failed-links.csv", newline="") as f:
              rows = (line for line in f if not line.startswith("#"))
              for row in csv.DictReader(rows, delimiter=";"):
                  if row.get("valid", "").strip().lower() == "false":
                      url = row["urlname"]
                      if url and url not in seen:
                          seen.add(url)
                          print(url)
          PY

          count=$(grep -c . failed-urls.txt || true)
          if [ "$count" -eq 0 ]; then
            echo "No broken links to retry (all failures were ignored)."
            exit 0
          fi

          echo "Retrying $count failed link(s) after a 60s delay:"
          cat failed-urls.txt
          sleep 60

          # Second pass: re-check only the previously failed links.
          linkchecker --no-warning --recursion-level=0 $(cat failed-urls.txt)

      - name: Send message on failure
        if: failure()
        run: curl -X POST -F "workflow=${GITHUB_WORKFLOW}" -F "repo_name=${GITHUB_REPOSITORY}" -F "action_id=${GITHUB_RUN_ID}" ${{ secrets.BOT_URL }}?room=web-alerts
