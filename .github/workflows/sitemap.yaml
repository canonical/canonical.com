name: Sitemap generation for static pages on canonical.com
on:
  push:
    branches:
      - main
    paths:
      - "templates/**"

permissions:
  contents: read

jobs:
  generate-sitemap:
    if: github.repository == 'canonical/canonical.com'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Call sitemap generation endpoint
        env:
          SITEMAP_SECRET: ${{ secrets.SITEMAP_SECRET }}
        run: |
          curl --fail-with-body -X POST "https://canonical.com/sitemap_tree.xml" \
          -H "Authorization: Bearer ${SITEMAP_SECRET}"

      - name: Send message on failure
        if: failure()
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        run: curl -X POST -F "workflow=${GITHUB_WORKFLOW}" -F "repo_name=${GITHUB_REPOSITORY}" -F "action_id=${GITHUB_RUN_ID}" "${BOT_URL}?room=web-alerts"
