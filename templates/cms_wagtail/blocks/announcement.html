<div class="u-fixed-width">
  <div class="p-notification--{{ macro.modifier }}">
    <div class="p-notification__content">
      {% if value.heading %}<h5 class="p-notification__title">{{ value.heading }}</h5>{% endif %}
      <div class="p-notification__message">{{ macro.body }}</div>
    </div>
  </div>
</div>
