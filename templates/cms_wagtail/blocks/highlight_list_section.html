<section class="p-section">
  <div class="row--25-75">
    <hr class="p-rule" />
    <div class="col">
      <h2 class="p-text--small-caps">{{ value.title }}</h2>
    </div>
    <div class="col">
      <ul class="p-list--divided">
        {% for item in value["items"] %}
          <li class="p-list__item u-no-padding"><p class="p-heading--2">{{ item }}</p></li>
        {% endfor %}
      </ul>
    </div>
  </div>
</section>
